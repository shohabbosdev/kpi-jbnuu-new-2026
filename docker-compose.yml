services:
  # ==========================================
  # 1. BACKEND SERVISI (FastAPI + SQLite)
  # ==========================================
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: kpi_backend
    restart: unless-stopped
    ports:
      - "8080:8080"
    volumes:
      # Ma'lumotlar bazasi va yuklangan hujjatlar doimiyligi (Persistence)
      - ./backend/kpi_system.db:/app/kpi_system.db
      - ./backend/uploads:/app/uploads
    env_file:
      - ./backend/.env
    environment:
      - PYTHONUNBUFFERED=1
      - PORT=8080
    networks:
      - kpi_network

  # ==========================================
  # 2. FRONTEND SERVISI (Next.js SSR)
  # ==========================================
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: kpi_frontend
    restart: unless-stopped
    ports:
      - "3000:3000"
    depends_on:
      - backend
    environment:
      - NODE_ENV=production
      - PORT=3000
    networks:
      - kpi_network

  # ==========================================
  # 3. NGINX REVERSE PROXY & YUKLASH LIMITI (10MB)
  # ==========================================
  nginx:
    image: nginx:alpine
    container_name: kpi_nginx
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - backend
      - frontend
    networks:
      - kpi_network

networks:
  kpi_network:
    driver: bridge
